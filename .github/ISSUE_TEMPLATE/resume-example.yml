name: Submit a resume bullet example
description: Submit your own redacted bullet for community review. No Git required.
title: "[Example]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This issue and its history are public. Remove names, contacts, private URLs, and identifying incident details before posting. Use placeholders such as `[COMPANY]`, `[PRODUCT]`, and `[TEAM]`. Do not attach resumes, screenshots, logs, dashboards, customer data, or confidential evidence.

        A reviewer may suggest edits. You will approve the final wording and byline before the example is accepted. Submission is not acceptance or a claim that the bullet led to a hire.

  - type: dropdown
    id: discipline
    attributes:
      label: Discipline
      options:
        - Backend engineering
        - Frontend engineering
        - Data engineering
        - AI engineering
        - ML engineering
        - General software engineering
    validations:
      required: true

  - type: dropdown
    id: career-stage
    attributes:
      label: Career stage
      options:
        - New grad or early career
        - Experienced
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Role
      description: Use a generic role only. Do not name an employer or client.
      placeholder: Software Engineer
    validations:
      required: true

  - type: textarea
    id: original
    attributes:
      label: Original wording
      description: Paste a bullet you wrote and have the right to share. Redact it before submitting.
      placeholder: Built [SYSTEM] to support [WORKFLOW] using [TECHNOLOGY].
    validations:
      required: true

  - type: textarea
    id: rewrite
    attributes:
      label: Proposed rewrite
      description: Keep the claim faithful to your real contribution and seniority. Maintainers may refine it during review.
      placeholder: Fixed [FAILURE] in [WORKFLOW] by [CHANGE]; added [TEST] that failed before the fix.
    validations:
      required: true

  - type: textarea
    id: contribution-context
    attributes:
      label: Contribution and context
      description: State what you personally owned, the problem or user need, and one relevant constraint. Separate your work from the team's result.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Context and checks
      description: Describe what shipped, passed, reconciled, or was adopted and how you checked it. Say whether this was production, a local benchmark, a test, or another setting. For a number, give its unit, scope, time window, method, and comparison baseline where applicable. "No number" is valid. Do not upload private proof.
    validations:
      required: true

  - type: textarea
    id: why-better
    attributes:
      label: Why does the rewrite help?
      description: Explain how it makes ownership, technical judgment, or evidence clearer without inflating the claim.
    validations:
      required: true

  - type: input
    id: attribution
    attributes:
      label: Optional attribution
      description: Add the name or GitHub handle to show in the published example. Leave blank for Anonymous. Your GitHub account and this submission history remain public either way.

  - type: checkboxes
    id: permission
    attributes:
      label: Permission and privacy
      options:
        - label: I wrote the original wording, have the right to submit it, and did not copy it from someone else's private resume.
          required: true
        - label: I removed employer, client, customer, product, team, and confidential system details.
          required: true
        - label: Every claim and number is truthful; I did not invent a metric or include private evidence.
          required: true
        - label: I understand this issue is public and permit this submission to be published under the repository's MIT License.
          required: true
