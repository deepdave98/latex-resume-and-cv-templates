name: Improvement idea
description: Suggest a change to a template, tool, or guide.
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - No Internship template
        - New Grad template
        - Experienced template
        - AI Engineer template
        - ML Engineer template
        - Graduate Admissions template
        - PDF reviewer
        - Multiple templates
        - Repository or documentation
    validations:
      required: true
